[project]
name = "contador-de-historias-backend"
version = "0.1.0"
description = "Backend narrativo interativo estilo PolyBuzz com FastAPI, PostgreSQL e streaming LLM."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

